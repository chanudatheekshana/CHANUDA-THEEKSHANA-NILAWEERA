<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pixelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2b"/>
      <stop offset="50%" stop-color="#0d051a"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#pixelBg)"/>

  <!-- Cyberpunk pixel grid floor -->
  <g stroke="rgba(236,72,153,0.15)" stroke-width="1">
    <!-- horizontal grid lines -->
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="425" x2="800" y2="425"/>
    <line x1="0" y1="465" x2="800" y2="465"/>
    <!-- perspective lines -->
    <line x1="400" y1="320" x2="0" y2="500"/>
    <line x1="400" y1="320" x2="120" y2="500"/>
    <line x1="400" y1="320" x2="250" y2="500"/>
    <line x1="400" y1="320" x2="380" y2="500"/>
    <line x1="400" y1="320" x2="420" y2="500"/>
    <line x1="400" y1="320" x2="550" y2="500"/>
    <line x1="400" y1="320" x2="680" y2="500"/>
    <line x1="400" y1="320" x2="800" y2="500"/>
  </g>

  <!-- Top Browser Bar -->
  <rect width="800" height="42" rx="16" fill="#0d051a"/>
  <rect y="32" width="800" height="10" fill="#0d051a"/>
  
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="46" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="5" fill="#10b981"/>

  <!-- URL Address Bar -->
  <rect x="140" y="10" width="520" height="22" rx="6" fill="#1f1138"/>
  <svg x="152" y="14" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
  <text x="175" y="25" fill="#c4b5fd" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500">
    chanudatheekshana.github.io/bunny-pixel/
  </text>

  <!-- App Header -->
  <rect x="40" y="60" width="720" height="48" rx="8" fill="#1b0e33" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="60" y="90" fill="#f43f5e" font-family="'Courier New', monospace" font-size="20" font-weight="900">🐰 BUNNY PIXEL</text>
  <text x="240" y="90" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="12">Interactive Retro Canvas &amp; Creative Art</text>

  <!-- Palette Tools -->
  <g transform="translate(560, 72)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#ef4444"/>
    <rect x="28" y="0" width="22" height="22" rx="4" fill="#3b82f6"/>
    <rect x="56" y="0" width="22" height="22" rx="4" fill="#10b981"/>
    <rect x="84" y="0" width="22" height="22" rx="4" fill="#facc15"/>
    <rect x="112" y="0" width="22" height="22" rx="4" fill="#ec4899"/>
    <rect x="140" y="0" width="22" height="22" rx="4" fill="#a855f7"/>
  </g>

  <!-- Canvas Box (Retro Pixel Screen) -->
  <rect x="40" y="125" width="460" height="330" rx="12" fill="#090314" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Glowing Pixel Art Bunny (Rendered as Crisp Pixel Blocks) -->
  <g transform="translate(190, 150)">
    <!-- Ambient Bunny Glow -->
    <ellipse cx="80" cy="130" rx="90" ry="70" fill="#ec4899" opacity="0.25" filter="url(#neonGlow)"/>

    <!-- Bunny Ears -->
    <!-- Left Ear -->
    <rect x="30" y="0" width="16" height="50" fill="#f472b6"/>
    <rect x="34" y="8" width="8" height="34" fill="#fda4af"/>
    <!-- Right Ear -->
    <rect x="94" y="0" width="16" height="50" fill="#f472b6"/>
    <rect x="98" y="8" width="8" height="34" fill="#fda4af"/>

    <!-- Head -->
    <rect x="20" y="50" width="100" height="70" rx="4" fill="#fdf2f8"/>
    <!-- Cheeks -->
    <rect x="24" y="90" width="16" height="12" fill="#f472b6"/>
    <rect x="100" y="90" width="16" height="12" fill="#f472b6"/>

    <!-- Pixel Eyes (Big cute anime eyes) -->
    <rect x="38" y="70" width="18" height="22" fill="#1e1b4b"/>
    <rect x="42" y="72" width="6" height="8" fill="#ffffff"/>
    <rect x="48" y="80" width="4" height="4" fill="#38bdf8"/>

    <rect x="84" y="70" width="18" height="22" fill="#1e1b4b"/>
    <rect x="88" y="72" width="6" height="8" fill="#ffffff"/>
    <rect x="94" y="80" width="4" height="4" fill="#38bdf8"/>

    <!-- Nose & Mouth -->
    <polygon points="67,95 73,95 70,99" fill="#f43f5e"/>
    <path d="M64 103 Q70 108 76 103" stroke="#f43f5e" stroke-width="2" fill="none"/>

    <!-- Body -->
    <rect x="32" y="120" width="76" height="60" rx="6" fill="#fdf2f8"/>
    <!-- Belly -->
    <rect x="48" y="128" width="44" height="42" rx="4" fill="#fbcfe8"/>

    <!-- Paws -->
    <rect x="18" y="130" width="16" height="20" rx="4" fill="#fdf2f8"/>
    <rect x="106" y="130" width="16" height="20" rx="4" fill="#fdf2f8"/>
    
    <!-- Feet -->
    <rect x="26" y="180" width="28" height="14" rx="4" fill="#fdf2f8"/>
    <rect x="86" y="180" width="28" height="14" rx="4" fill="#fdf2f8"/>
  </g>

  <!-- Right Side Panel: Controls & Info -->
  <g transform="translate(520, 125)">
    <!-- Canvas Info Card -->
    <rect width="240" height="150" rx="10" fill="#140a26" stroke="#2e1065" stroke-width="1"/>
    <text x="20" y="32" fill="#f472b6" font-family="'Inter', sans-serif" font-size="14" font-weight="800">Pixel Matrix 64x64</text>
    <text x="20" y="55" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11">Real-time canvas rendering with retro CRT scanline styling &amp; sprite animation.</text>
    
    <rect x="20" y="78" width="200" height="1" fill="#3b0764"/>
    
    <text x="20" y="104" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">FPS: <tspan fill="#10b981" font-weight="700">60 FPS</tspan></text>
    <text x="120" y="104" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Tool: <tspan fill="#38bdf8" font-weight="700">Brush</tspan></text>
    <text x="20" y="128" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Mode: <tspan fill="#ec4899" font-weight="700">Interactive</tspan></text>

    <!-- Play / Draw CTA Button -->
    <rect y="170" width="240" height="50" rx="10" fill="url(#neonPink)"/>
    <text x="120" y="201" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">🎨 DRAW / PLAY LIVE</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="112" height="28" rx="6" fill="#1b0e33" stroke="#8b5cf6" stroke-width="1"/>
      <text x="56" y="18" fill="#c4b5fd" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">✨ Retro Audio</text>

      <rect x="128" y="0" width="112" height="28" rx="6" fill="#1b0e33" stroke="#8b5cf6" stroke-width="1"/>
      <text x="184" y="18" fill="#c4b5fd" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">💾 Export PNG</text>

      <rect x="0" y="38" width="112" height="28" rx="6" fill="#1b0e33" stroke="#8b5cf6" stroke-width="1"/>
      <text x="56" y="56" fill="#c4b5fd" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">🕹️ 8-Bit Vibes</text>

      <rect x="128" y="38" width="112" height="28" rx="6" fill="#1b0e33" stroke="#8b5cf6" stroke-width="1"/>
      <text x="184" y="56" fill="#c4b5fd" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚡ Pure JS</text>
    </g>
  </g>
</svg>

