<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c41230"/>
      <stop offset="100%" stop-color="#e8173a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient light orb -->
  <circle cx="700" cy="120" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="100" cy="400" r="120" fill="#c41230" opacity="0.1" filter="url(#glow)"/>

  <!-- Browser Chrome Top Bar -->
  <rect width="800" height="42" rx="16" fill="#0b1120"/>
  <rect y="32" width="800" height="10" fill="#0b1120"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="46" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="5" fill="#10b981"/>

  <!-- URL Address Bar -->
  <rect x="140" y="10" width="520" height="22" rx="6" fill="#1e293b"/>
  <svg x="152" y="14" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
  <text x="175" y="25" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500">
    chanudatheekshana.github.io/SMP-Education/
  </text>

  <!-- Website Header inside mockup -->
  <rect x="40" y="62" width="720" height="48" rx="8" fill="#1e293b" opacity="0.6"/>
  <!-- Logo -->
  <rect x="56" y="74" width="24" height="24" rx="6" fill="url(#crimsonGrad)"/>
  <text x="68" y="90" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">S</text>
  <text x="90" y="91" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">SMP Education</text>
  <text x="210" y="91" fill="#3b82f6" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Online Academy</text>

  <!-- Nav links mockup -->
  <rect x="470" y="80" width="46" height="12" rx="4" fill="#334155"/>
  <rect x="530" y="80" width="54" height="12" rx="4" fill="#334155"/>
  <rect x="600" y="80" width="48" height="12" rx="4" fill="#334155"/>
  <rect x="665" y="74" width="80" height="24" rx="6" fill="url(#accentGrad)"/>
  <text x="705" y="90" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Enroll Now</text>

  <!-- Hero Section in mockup -->
  <!-- Badge -->
  <rect x="56" y="130" width="140" height="22" rx="11" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="126" y="145" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">🎓 Future-Ready Learning</text>

  <!-- Main Headline -->
  <text x="56" y="185" fill="#ffffff" font-family="'Inter', sans-serif" font-size="28" font-weight="800">
    Empowering Student Success
  </text>
  <text x="56" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="400">
    Comprehensive curriculum, interactive modules &amp; expert guidance.
  </text>

  <!-- CTA Buttons -->
  <rect x="56" y="240" width="120" height="34" rx="8" fill="url(#crimsonGrad)"/>
  <text x="116" y="262" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">View Courses</text>
  
  <rect x="188" y="240" width="120" height="34" rx="8" fill="transparent" stroke="#334155" stroke-width="1.5"/>
  <text x="248" y="262" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Learn More</text>

  <!-- Right Hero Visual: Course Preview Card -->
  <g transform="translate(460, 130)">
    <rect width="280" height="170" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Card Media Banner -->
    <rect x="12" y="12" width="256" height="80" rx="8" fill="#1e1b4b"/>
    <!-- Illustration elements inside banner -->
    <circle cx="80" cy="52" r="28" fill="#4338ca" opacity="0.6"/>
    <polygon points="140,30 180,65 130,75" fill="#6366f1" opacity="0.4"/>
    <text x="140" y="58" fill="#e0e7ff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">A/L Advanced Modules</text>

    <!-- Meta row -->
    <rect x="12" y="104" width="80" height="16" rx="4" fill="rgba(16,185,129,0.15)"/>
    <text x="52" y="116" fill="#10b981" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Active Session</text>
    
    <text x="12" y="142" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Mathematics &amp; Physical Sciences</text>
    <text x="12" y="160" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Interactive live lectures + recordings</text>
  </g>

  <!-- Bottom Stats Grid -->
  <g transform="translate(56, 320)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="215" height="140" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="38" fill="#3b82f6" font-family="'Inter', sans-serif" font-size="24" font-weight="800">500+</text>
    <text x="20" y="64" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Students Guided</text>
    <text x="20" y="86" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Structured progress tracking &amp; assessments</text>
    <rect x="20" y="106" width="175" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="106" width="140" height="6" rx="3" fill="#3b82f6"/>

    <!-- Stat 2 -->
    <rect x="235" y="0" width="215" height="140" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="255" y="38" fill="#10b981" font-family="'Inter', sans-serif" font-size="24" font-weight="800">100%</text>
    <text x="255" y="64" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Digital Access</text>
    <text x="255" y="86" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">24/7 access to revision notes and papers</text>
    <rect x="255" y="106" width="175" height="6" rx="3" fill="#1e293b"/>
    <rect x="255" y="106" width="165" height="6" rx="3" fill="#10b981"/>

    <!-- Stat 3 -->
    <rect x="470" y="0" width="215" height="140" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="490" y="38" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Top Tier</text>
    <text x="490" y="64" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">A/L Exam Results</text>
    <text x="490" y="86" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">High distinction rates across student batches</text>
    <rect x="490" y="106" width="175" height="6" rx="3" fill="#1e293b"/>
    <rect x="490" y="106" width="150" height="6" rx="3" fill="#f59e0b"/>
  </g>
</svg>

